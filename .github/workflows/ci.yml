name: ETL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run sample ETL
        run: |
          python healthstream_etl.py --input data/sample_encounters.csv --output-dir /tmp/healthstream-output
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/healthstream-output/quality_report.json").read_text())
          assert report["input_rows"] == 7
          assert report["accepted_rows"] == 4
          assert report["duplicate_rows"] == 1
          assert report["rejected_rows"] == 3
          PY
